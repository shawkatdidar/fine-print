    <img src="icons/icon-32.png" width="22" height="22" alt="">

      <div class="server"><input id="server" type="text" spellcheck="false" placeholder="https://fineprint.buildtube.app"><button id="save" type="button">Save</button></div>

  </section>
  <footer>A fast first read by SubQ, not legal advice. <a href="https://fineprint.buildtube.app/#/anywhere" target="_blank" rel="noopener">How it works</a></footer>
